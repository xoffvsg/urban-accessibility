# City config — copy this file and change the values to run another location.
slug: carson_city                 # also the PostGIS schema name and data/ subfolder
name: "Carson City, NV"

bbox:                             # WGS84 degrees
  lon_min: -119.8
  lat_min: 39.0
  lon_max: -119.7
  lat_max: 39.2
edge_buffer_m: 2000               # fetch services this far outside the bbox (edge effects)
analysis_crs: auto                # auto = UTM zone of bbox centroid (here EPSG:32611)
data_dir: data                    # relative to repo root; may be a Linux path (e.g. ~/data/urban_access) for speed

overture:
  release: "2026-10-21.0"         # pin; record in README

census:
  state_fips: auto                # auto = detect from bbox (Carson City: 32)
  county_fips: auto               # (Carson City: 510)
  acs_year: 2024                  # ACS 5-year end year — verify latest available

transit:
  # JAC (Jump Around Carson) via TransLoc; verified 2026-10-30 (184 stops, calendar to 2032-10-30).
  # The older carson.org document link no longer resolves. The zip is cached in data/raw/<slug>/.
  gtfs_url: "https://JumpAroundCarson.transloc.com/Secure/Admin/Reports/GTFSDownload.aspx"

# City-specific additions to config/scoring.yaml `services:` (case-insensitive regex on names.primary).
# include_names adds places whatever their category; exclude_names removes category matches.
# Set from data/interim/<slug>/service_review.csv (notebook 00).
services:
  grocery:
    include_names: ["^walmart$", "^target$", "^costco$", "^grocery outlet", "^raley'?s", "^trader joe'?s"]
    exclude_names: ["grocery pickup", "popcorn", "am ?pm", "liquor"]
  healthcare:
    include_names: ["^sierra family health center"]   # primary care tagged doctors_office
    exclude_names: ["d\\.?d\\.?s", "dental", "marketers", "hometown health", "medical capital",
                    "behavioral health"]
  schools:
    # K-8 private schools tagged school/private_school (verify grades before publishing)
    include_names: ["^st\\.? teresa'?s school", "^bethlehem lutheran school"]
    exclude_names: ["free world u", "centro de desarrollo", "moulage", "wild west medical"]
  parks:
    exclude_names: ["parks and recreation department", "^nevada state parks$", "nature conservancy",
                    "air park"]

# Field-checked fixes for single places, keyed by Overture place id (full id or a unique prefix of
# at least 8 characters; `ref` in service_review.csv and service_points is the 8-character prefix).
# drop: true removes the place from every service; lon/lat (WGS84) moves it. Applied before matching.
place_overrides:
  245a2ecf-041c-4e1e-ba16-8ef661b5762f: {drop: true, note: "Walmart: now a Ross store (checked 2026-10-30)"}
  04d8348a-7589-4aee-91c0-190002195402: {drop: true, note: "Grocery Outlet: does not exist (checked 2026-10-30)"}
  003309e4-3db9-4585-bdc8-7599b2d2650c: {drop: true, note: "Foothill Market: does not exist (checked 2026-10-30)"}
  191f0225-ce09-4319-8c54-8b8c05813e59: {drop: true, note: "Save Mart: does not exist (checked 2026-10-30)"}
  9bb486d2-af18-44a9-a2b2-d251aff25620: {lon: -119.754751, lat: 39.187078, note: "Sprouts Farmers Market: moved to the store (checked 2026-10-30)"}

# Segments closed to walkers in reality but not in Overture (fences, locked gates), by Overture
# segment id → note. Excluded from the walk network (walk_segments.foot_ok = false, blocked_note).
blocked_segments:
  46145bf6-be49-4bd7-87fa-33f45fa1c9b7: "crosswalk at the south end of Pintail Dr: fence, no access to Fairview Dr (checked 2026-10-30)"

# Gated areas (GeoJSON polygons in WGS84, path relative to this folder; edit in QGIS). Every walk
# edge crossing a boundary is removed except edges of the streets in the feature's `exits` list;
# homes and services inside snap only to edges inside, and outside ones only to edges outside.
gated_areas: carson_city_gated_areas.geojson

# Gates checked in the field (GeoJSON lines drawn across each gate, WGS84; edit in QGIS).
# status closed: walk edges the line crosses are removed. status open: the line becomes a walk
# link between the nearest edges at its two ends, and it is an exit through any gated-area boundary.
# OSM gates tagged access=no / foot=no are closed automatically (osm step); others are reference only.
gates: carson_city_gates.geojson
