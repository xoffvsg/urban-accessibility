  04d8348a-7589-4aee-91c0-190002195402: {drop: true, note: "Grocery Outlet: does not exist (checked 2026-10-30)"}
  003309e4-3db9-4585-bdc8-7599b2d2650c: {drop: true, note: "Foothill Market: does not exist (checked 2026-10-30)"}
  191f0225-ce09-4319-8c54-8b8c05813e59: {drop: true, note: "Save Mart: does not exist (checked 2026-10-30)"}
  fddcf37b-a00a-47ee-b3ed-a179861e239b: {drop: true, note: "Capital Christian School: same site as Legacy Christian Academy (NCES PSS 2023-24, K-8); one school (checked 2026-10-31)"}
  714ac3d7-8275-4c48-9d0f-f79f76b302d4: {drop: true, note: "Kabayan Asian Multi Mart: not a full-service grocery, not in SNAP (checked 2026-10-31)"}
