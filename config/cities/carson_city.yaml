  f2676f72-2ab8-4fa0-8946-1e003adb32b5: {drop: true, note: "Carson Tahoe Physician Clinic at Walmart: permanently closed, as is the US 395 Walmart clinic (checked 2026-10-31)"}
  56a36b1f-177f-413b-acae-ece80c0ab4ee: {drop: true, note: "Carson Tahoe Retail Clinic At Walmart (US 395): permanently closed (checked 2026-10-31)"}
