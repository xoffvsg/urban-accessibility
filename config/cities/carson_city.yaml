  946eac16-b781-44ac-96c1-0487e7126d08: {drop: true, note: "Carson Tahoe Physician: closed; the only Carson Tahoe physician clinic left is the Cancer Center (checked 2026-10-31)"}
  9bb486d2-af18-44a9-a2b2-d251aff25620: {lon: -119.754751, lat: 39.187078, note: "Sprouts Farmers Market: moved to the store (checked 2026-10-30)"}

# Segments closed to walkers in reality but not in Overture (fences, locked gates), by Overture
# segment id → note. Excluded from the walk network (walk_segments.foot_ok = false, blocked_note).
blocked_segments:
  46145bf6-be49-4bd7-87fa-33f45fa1c9b7: "crosswalk at the south end of Pintail Dr: fence, no access to Fairview Dr (checked 2026-10-30)"

# Gated areas (GeoJSON polygons in WGS84, path relative to this folder; edit in QGIS). Every walk
# edge crossing a boundary is removed except edges of the streets in the feature's `exits` list;
# homes and services inside snap only to edges inside, and outside ones only to edges outside.
gated_areas: carson_city_gated_areas.geojson

# Gates checked in the field (GeoJSON lines drawn across each gate, WGS84; edit in QGIS).
# status closed: walk edges the line crosses are removed. status open: the line becomes a walk
# link between the nearest edges at its two ends, and it is an exit through any gated-area boundary.
# OSM gates tagged access=no / foot=no are closed automatically (osm step); others are reference only.
gates: carson_city_gates.geojson

# Cross-checks with open data (`make xcheck SOURCE=all`; method settings in scoring.yaml xcheck:).
xcheck:
  nppes_postal_codes: ["89701", "89703", "89705", "89706", "89423"]
  # Carson City GIS "Carson City Parks and Open Space" (2023; Carson City only; no licence stated,
  # used with attribution). Polygons in the scoring.yaml xcheck.parks categories that overlap no
  # Overture park are added to the parks layer (city decision 2026-10-31).
  city_parks_url: "https://services5.arcgis.com/C0ejqMIMxJZHALms/arcgis/rest/services/Parks_and_Trails/FeatureServer/2"
  city_parks_source: "Carson City GIS"
extra_parks: true

# Where people live: dwelling units per parcel, one entry per county (state + county FIPS). Counties
# without an entry keep the footprint heuristic (scoring.yaml residential:). Only the fields listed
# here are requested: the parcel layers also hold owner names and mailing addresses, never fetched.
# No licence stated by either county; raw files stay in data/, only block-group results are published.
homes:
  - county: "32510"
    source: "Carson City GIS Existing Land Use"
    url: "https://services5.arcgis.com/C0ejqMIMxJZHALms/arcgis/rest/services/Existing_Land_Use_Final/FeatureServer/0"
    units_field: Total_DWUn           # dwelling units (assessor)
    category_field: LU_Categor
  - county: "32005"
    source: "Douglas County GIS zoning and parcels"
    parcels_url: "https://gisservices.douglasnv.us/server/rest/services/Douglas/Parcels__Oracle/FeatureServer/0"
    zoning_url: "https://gisservices.douglasnv.us/server/rest/services/Zoning/FeatureServer/3"
    zone_field: ZoningCode
    one_per_parcel: ["SFR-*", "RA-*", "A-*", "FR-*", "WASHOE TRIBE"]   # one home, largest building
    floor_area: ["MFR"]               # units = floor area / m2_per_unit
                 # add the city park polygons above to the parks layer
