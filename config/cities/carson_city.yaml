  # in-store pharmacies share their store's point (one entrance, one walk)
  f7a6f67b-08ee-4b49-9cd5-c9e9102b4c66: {lon: -119.778277, lat: 39.111867, note: "Walmart Pharmacy: moved to its Walmart store point (990f520a, US 395 S) (2026-10-31)"}
  b24cb09d-d060-45ee-90ce-54b8da365c8b: {lon: -119.75753, lat: 39.187265, note: "Walmart Pharmacy: moved to its Walmart store point (16030ee4, Market St) (2026-10-31)"}
