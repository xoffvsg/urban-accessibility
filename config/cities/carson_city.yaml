# City config — copy this file and change the values to run another location.
slug: carson_city                 # also the PostGIS schema name and data/ subfolder
name: "Carson City, NV"

bbox:                             # WGS84 degrees
  lon_min: -119.8
  lat_min: 39.0
  lon_max: -119.7
  lat_max: 39.2
edge_buffer_m: 2000               # fetch services this far outside the bbox (edge effects)
analysis_crs: auto                # auto = UTM zone of bbox centroid (here EPSG:32611)
data_dir: data                    # relative to repo root; may be a Linux path (e.g. ~/data/urban_access) for speed

overture:
  release: "2026-10-21.0"         # pin; record in README

census:
  state_fips: auto                # auto = detect from bbox (Carson City: 32)
  county_fips: auto               # (Carson City: 510)
  acs_year: 2024                  # ACS 5-year end year — verify latest available

transit:
  # JAC (Jump Around Carson) via TransLoc; verified 2026-10-30 (184 stops, calendar to 2032-10-30).
  # The older carson.org document link no longer resolves. The zip is cached in data/raw/<slug>/.
  gtfs_url: "https://JumpAroundCarson.transloc.com/Secure/Admin/Reports/GTFSDownload.aspx"

# City-specific additions to config/scoring.yaml `services:` (case-insensitive regex on names.primary).
# include_names adds places whatever their category; exclude_names removes category matches.
# Set from data/interim/<slug>/service_review.csv (notebook 00).
services:
  grocery:
    include_names: ["^walmart$", "^target$", "^costco$", "^grocery outlet", "^raley'?s", "^trader joe'?s"]
    exclude_names: ["grocery pickup", "popcorn", "am ?pm", "liquor"]
  healthcare:
    include_names: ["^sierra family health center"]   # primary care tagged doctors_office
    exclude_names: ["d\\.?d\\.?s", "dental", "marketers", "hometown health", "medical capital",
                    "behavioral health"]
  schools:
    # K-8 private schools tagged school/private_school (verify grades before publishing)
    include_names: ["^st\\.? teresa'?s school", "^bethlehem lutheran school"]
    exclude_names: ["free world u", "centro de desarrollo", "moulage", "wild west medical"]
  parks:
    exclude_names: ["parks and recreation department", "^nevada state parks$", "nature conservancy",
                    "air park"]
