  01c77477-f2a2-454a-bb5e-296b1dcd59ca: {drop: true, note: "Carson Tahoe Cardiology: NPPES cardiovascular disease, specialist (2026-10-31)"}
  0eb6007c-cb59-4758-a041-01d1eed51a14: {drop: true, name: "Carson Tahoe Cancer Center", note: "1535 Medical Pkwy: the Carson Tahoe Cancer Center (NPPES hematology & oncology), specialist; same as 5492dfc9 (checked 2026-10-31)"}
  524e0a48-90ed-47a4-acfa-9fac4245cc5c: {drop: true, note: "Swift Institute: NPPES medical equipment supplier, not care (2026-10-31)"}
