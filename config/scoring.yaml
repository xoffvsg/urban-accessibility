# Method settings shared by all cities.

walk_speed_m_per_min: 80          # 400 m ≈ 5 min

bands:                            # network distance (m) -> access value
  - {max_m: 400,  value: 1.0}     # 5-min walk
  - {max_m: 800,  value: 0.6}     # 10-min walk
  - {max_m: 1600, value: 0.3}     # 20-min walk
                                  # beyond last band -> 0

weights:                          # must sum to 1.0
  grocery: 0.25
  healthcare: 0.20
  transit: 0.20
  schools: 0.20
  parks: 0.15

# Overture places → service mapping. Set from notebooks/00_explore_categories.ipynb (release 2026-10-21.0).
# `taxonomy` values match taxonomy.hierarchy (primary + all ancestors) or taxonomy.alternates.
# City-specific name include/exclude lists go in config/cities/<slug>.yaml under `services:`.
# All services: permanently_closed places dropped; confidence >= min_confidence (per-service override).
services:
  grocery:                        # full-service grocery only
    taxonomy: [grocery_store, supermarket]
    secondary:                    # reported as a side metric, not in the score
      convenience: [convenience_store]
  healthcare:                     # essential: primary/urgent care, pharmacy, hospital. Excludes doctors_office
                                  # (mostly specialists + mis-tagged businesses here), dental, eye, EMS.
    taxonomy: [pharmacy, drugstore, primary_care_or_general_clinic, urgent_care_clinic,
               walk_in_clinic, pediatric_clinic, hospital]
    min_confidence: 0.6
  schools:                        # K-8 only (elementary + middle)
    taxonomy: [elementary_school, middle_school]
    min_confidence: 0.6
  parks:
    taxonomy: [park, dog_park, playground, skate_park]
    landuse:                      # Overture base/land_use subtype -> classes (park polygons)
      park: [park, dog_park]
      recreation: [playground, recreation_ground]
  transit:                        # Overture fallback only; GTFS stops are used when transit.gtfs_url is set
    taxonomy: [bus_station, bus_stop, public_transit_facility_or_service, train_station]
    prefer_gtfs: true

min_place_confidence: 0.5         # bbox p10 = 0.55; noise mostly below 0.6
max_snap_distance_m: 200          # flag origins/destinations farther than this from the network
dedupe_distance_m: 75             # same normalised name within this distance = one place

# Walk network (sql/20_network.sql: motorways and foot-denied segments are dropped; largest
# connected component only) and destination snapping.
network:
  park_access_step_m: 25          # park boundary densified every 25 m ...
  park_access_max_m: 30           # ... points within 30 m of a walkable edge are park entrances
  service_area_buffer_m: 50       # 400 m service area = reachable edge portions buffered by this

# Dasymetric population (sql/30_origins.sql)
residential:
  unclassified_min_area_m2: 40    # unclassified footprints in this range count as homes ...
  unclassified_max_area_m2: 1500  # ... unless a non-residential place lies inside
  floor_height_m: 3.5             # floors = num_floors, else round(height / 3.5), min 1
  fallback_grid_m: 50             # point grid for a populated block group with no homes
  # Parcel dwelling units (city config `homes:`; sql/30_origins.sql): units go to buildings whose
  # point-on-surface lies in the parcel, of at least unclassified_min_area_m2, with one of these
  # subtypes (None = no subtype) and not one of these classes.
  parcel_subtypes: [null, residential]
  parcel_exclude_classes: [garage, garages, carport, shed, roof, parking, shelter, storage_tank, hotel]
  m2_per_unit: 90                 # floor_area rule: dwelling units = floor area / this

# Equity analysis (src/urban_access/equity.py, notebook 06)
equity:
  poverty_ratio: 2.0              # "low income" = income below 2.0 x poverty line (ACS C17002 bin edge)
  mc_draws: 1000                  # Monte Carlo draws from ACS margins of error (SE = MOE / 1.645)
  seed: 20261030                  # fixed seed: reruns give identical ranges
  lisa_permutations: 9999         # local Moran's I permutations
  lisa_alpha: 0.05                # cluster significance level

# Cross-checks with authoritative open data (src/urban_access/xcheck.py, `make xcheck`): review
# tables only; decisions go into the city's include/exclude lists and place_overrides.
xcheck:
  confirm_m: 150                  # name match within this distance = confirmed; farther = moved
  max_m: 500                      # no match beyond this distance
  min_name_similarity: 0.6        # share of distinctive name words in common (see xcheck.name_similarity)
  overture_taxonomy: [education]  # Overture candidates: places with this in taxonomy.hierarchy
  schools:                        # NCES EDGE (public, CCD) + PSS (private); school years, newest first
    public_year: "2425"
    private_years: ["2324", "2122"]   # PSS is a survey: non-respondents are filled from the older year
  grocery:                        # USDA SNAP authorized retailers (live ArcGIS layer)
    url: "https://services1.arcgis.com/RLQu0rK7h4kbsBq5/arcgis/rest/services/snap_retailer_location_data/FeatureServer/0"
    confirm_m: 250                # big stores: SNAP points often sit on the parking lot or parcel
    full_service: ["Supermarket", "Super Store"]   # SNAP "Grocery Store" also covers pizza and meat shops
  healthcare:                     # CMS NPPES organization NPIs (geocoded) + HRSA health center sites
    nppes_url: "https://npiregistry.cms.hhs.gov/api/"
    geocoder_url: "https://geocoding.geo.census.gov/geocoder/locations/addressbatch"
    hrsa_url: "https://data.hrsa.gov/DataDownload/DD_Files/Health_Center_Service_Delivery_and_LookAlike_Sites.csv"
    overture_taxonomy: [health_care]
    min_name_similarity: 0.75    # stricter: parent systems ("Carson Tahoe Regional …") share words
    site_m: 60                    # NPPES orgs this close to a place are listed as site context
    essential_taxonomy:           # NUCC code prefixes = the healthcare service definition
      - "207Q"                    # family medicine
      - "207R00000X"              # internal medicine (general only)
      - "208D"                    # general practice
      - "208000000X"              # pediatrics (general only)
      - "261QP2300X"              # clinic: primary care
      - "261QU0200X"              # clinic: urgent care
      - "261QF0400X"              # clinic: federally qualified health center
      - "261QR1300X"              # clinic: rural health
      - "282N"                    # general acute care hospital
      - "3336"                    # pharmacy
  parks:                          # city park polygons (url in the city config)
    categories: ["PARK", "SPORT"] # city categories that count as parks (not open space, golf …)
    exclude_names: ["rifle", "pistol", "gun club"]

# Web map (src/urban_access/export.py → docs/data/<slug>_summary.json → docs/app.js)
web:
  # fixed absolute classes on access_score (same for every city); last class 60–100
  class_breaks: [0, 10, 20, 30, 40, 50, 60, 100]
  class_colors: ["#440154", "#443983", "#31688e", "#21918c", "#35b779", "#90d743", "#fde725"]  # viridis 7
  no_residents_color: "#d9d9d9"
  service_colors:                 # Okabe–Ito (colour-blind-safe categorical)
    grocery: "#E69F00"
    healthcare: "#D55E00"
    schools: "#CC79A7"
    transit: "#0072B2"
    parks: "#009E73"
    convenience: "#F0E442"
  cv_flag_pct: 30                 # ACS estimates with CV above this get an uncertainty badge
  basemap_style: "https://tiles.openfreemap.org/styles/positron"
  # neighborhood names (export.area_names): parks whose name contains one of these don't name an area
  area_name_skip: ["trail", "trailhead", "open space", "property"]
